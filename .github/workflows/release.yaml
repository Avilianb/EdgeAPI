name: release

on:
  push:
    tags:
      - "v*-http3.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release"
        required: true

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  release:
    name: Build release assets
    runs-on: ubuntu-24.04

    steps:
      - name: Check out EdgeAPI
        uses: actions/checkout@v4
        with:
          path: EdgeAPI
          ref: ${{ env.RELEASE_TAG }}

      - name: Check out EdgeNode dependency
        uses: actions/checkout@v4
        with:
          repository: Avilianb/EdgeNode
          ref: ${{ env.RELEASE_TAG }}
          path: EdgeNode

      - name: Check out EdgeCommon dependency
        uses: actions/checkout@v4
        with:
          repository: Avilianb/EdgeCommon
          ref: ${{ env.RELEASE_TAG }}
          path: EdgeCommon

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: true
          cache-dependency-path: |
            EdgeAPI/go.sum
            EdgeNode/go.sum
            EdgeCommon/go.sum

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Build package
        working-directory: EdgeAPI
        run: bash .github/scripts/package-linux-amd64.sh

      - name: Publish GitHub release
        working-directory: EdgeAPI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes="Community HTTP/3 edge-api release for Linux amd64. The package includes the matching edge-node deploy zip for node installation."
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/*.zip dist/SHA256SUMS.txt --clobber
          else
            gh release create "$RELEASE_TAG" dist/*.zip dist/SHA256SUMS.txt \
              --title "EdgeAPI $RELEASE_TAG" \
              --notes "$notes"
          fi
